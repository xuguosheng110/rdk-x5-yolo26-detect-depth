<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>RDK X5 · 三模式视觉</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151b;color:#eef3f9;font-family:system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}header{height:52px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}header b{font-size:18px;color:#f5a65b}#status{font-size:13px;color:#a6b5c8}main{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#070a0e}canvas{width:100%;height:100%;object-fit:contain}#waiting{position:absolute;text-align:center;padding:20px;background:#10151bea;border-radius:12px;max-width:90%;font-size:15px}nav{display:flex;gap:8px;padding:10px}button{touch-action:manipulation;cursor:pointer;flex:1;border:1px solid #394654;border-radius:10px;background:#202a35;color:#e6edf6;min-height:52px;font:600 16px system-ui}button.active{background:#ed9348;color:#17130f;border-color:#ed9348}button:disabled{opacity:.5}footer{font-size:12px;color:#a6b5c8;padding:0 12px 8px;text-align:center}@media(max-height:400px){header{height:34px;padding:5px 10px}header b{font-size:14px}#status{font-size:11px}nav{padding:5px;gap:5px}button{min-height:44px;font-size:13px;border-radius:7px}footer{font-size:10px;padding-bottom:4px}}
</style><header><b>RDK X5 · 视觉体验</b><span id="status">连接中</span></header><main><canvas id="view"></canvas><div id="waiting">正在连接设备…</div></main><nav><button data-mode="yolo">检测 + 单目深度</button><button data-mode="stereo">双目深度</button><button data-mode="body">人体 + 年龄</button></nav><footer id="note"></footer>
<script>
const UI_REVISION="__UI_REVISION__";document.documentElement.dataset.uiRevision=UI_REVISION;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),buttons=[...document.querySelectorAll('button')],waiting=document.querySelector('#waiting');let mode='',generation='',ready=false,busy=false;
const notes={yolo:'单目深度仅表示相对近远，不是米制距离',stereo:'近红远蓝 · 自适应色阶；测距标定待验收',body:'年龄为人脸模型估计，正面清晰人脸效果更好'};
buttons.forEach(b=>b.onclick=async()=>{if(busy)return;busy=true;buttons.forEach(x=>x.disabled=true);ready=false;waiting.hidden=false;waiting.textContent='正在切换算法，请稍候…';try{const r=await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:b.dataset.mode})});if(!r.ok)throw Error('切换请求失败');}catch(e){waiting.textContent=e.message;}finally{busy=false;}});
async function poll(){try{let r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();let s=await r.json();if(s.ui_revision&&s.ui_revision!==UI_REVISION){location.reload();return;}if(generation!==String(s.generation)){generation=String(s.generation);ctx.clearRect(0,0,canvas.width,canvas.height);}mode=s.mode;ready=s.phase==='ready';buttons.forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.disabled=busy||s.phase==='switching';});document.querySelector('#status').textContent=ready?'运行中 · '+Number(s.metrics?.display_fps||s.metrics?.fps||0).toFixed(1)+' FPS':s.phase==='switching'?'切换中':'等待图像';document.querySelector('#note').textContent=notes[mode];waiting.hidden=ready;waiting.textContent=s.error||(!s.camera_ready?'等待相机图像，恢复后自动显示':'算法加载中，请稍候…');}catch(e){ready=false;waiting.hidden=false;waiting.textContent='设备连接中断，正在自动重连…';}setTimeout(poll,700);}
async function frame(){if(ready){const gen=generation,m=mode;try{let r=await fetch('/frame.jpg?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(3000)});if(!r.ok)throw Error();const img=await createImageBitmap(await r.blob());if(gen===generation&&ready){if(m==='yolo'||m==='stereo'){canvas.width=img.width*2;canvas.height=img.height/2;ctx.drawImage(img,0,0,img.width,img.height/2,0,0,img.width,img.height/2);ctx.drawImage(img,0,img.height/2,img.width,img.height/2,img.width,0,img.width,img.height/2);}else{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0);}}img.close();}catch(e){}}setTimeout(frame,10);}poll();frame();
</script></html>
